<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Developer Metrics dashboard</title>
<desc id="desc">Animated blue and cyan engineering dashboard. Embedded GitHub Stats cards load profile metrics and language distribution dynamically.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#16304a" stroke-width=".7" opacity=".58"/></pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
    .label{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#8da8c4;letter-spacing:1.3px}
    .heading{font:700 23px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#eaf2fc;letter-spacing:1px}
    .small{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94a3b8}
    .panel{fill:#09111b;stroke:#24425f;stroke-width:1}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .scan{animation:scan 5.5s linear infinite}
    .dash{stroke-dasharray:5 8;animation:dash 12s linear infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(820px)}}
    @keyframes dash{to{stroke-dashoffset:-130}}
    @media(prefers-reduced-motion:reduce){.pulse,.scan,.dash{animation:none}}
  </style>
</defs>
<rect x="1" y="1" width="1098" height="388" rx="16" fill="url(#bg)" stroke="#28445e"/>
<rect x="10" y="10" width="1080" height="370" rx="12" fill="url(#grid)" opacity=".9"/>
<path d="M22 54V22H54 M1046 22h32v32 M22 336v32h32 M1046 368h32v-32" fill="none" stroke="#60a5fa" stroke-width="2"/>
<text x="42" y="48" class="mono" font-size="10" fill="#60a5fa">PROFILE ANALYTICS / 001</text>
<text x="42" y="82" class="heading">DEVELOPER METRICS</text>
<text x="43" y="103" class="label">CODE / BUILD / MEASURE / IMPROVE</text>
<circle cx="1012" cy="42" r="4" fill="#22d3ee" filter="url(#glow)" class="pulse"/>
<text x="1030" y="46" text-anchor="end" class="label" fill="#22d3ee">GITHUB DATA</text>
<path d="M40 120H1060" stroke="#20384f"/>
<rect x="40" y="139" width="490" height="174" rx="10" class="panel"/>
<rect x="550" y="139" width="510" height="174" rx="10" class="panel"/>
<rect x="40" y="139" width="490" height="3" rx="1.5" fill="#60a5fa"/>
<rect x="550" y="139" width="510" height="3" rx="1.5" fill="#22d3ee"/>
<text x="60" y="165" class="label" fill="#60a5fa">01 / PROFILE OVERVIEW</text>
<text x="570" y="165" class="label" fill="#22d3ee">02 / LANGUAGE DISTRIBUTION</text>
<image href="https://github-readme-stats.vercel.app/api?username=Akgt3&amp;show_icons=true&amp;hide_border=true&amp;bg_color=09111B&amp;title_color=60A5FA&amp;icon_color=22D3EE&amp;text_color=EAF2FC&amp;rank_icon=github&amp;include_all_commits=true" x="51" y="176" width="468" height="128" preserveAspectRatio="xMidYMid meet"/>
<image href="https://github-readme-stats.vercel.app/api/top-langs/?username=Akgt3&amp;layout=compact&amp;hide_border=true&amp;bg_color=09111B&amp;title_color=60A5FA&amp;text_color=EAF2FC&amp;langs_count=6" x="562" y="176" width="486" height="128" preserveAspectRatio="xMidYMid meet"/>
<path d="M50 326H1050" stroke="#24425f"/>
<text x="42" y="351" class="label">LIVE PROFILE SOURCES</text>
<text x="42" y="369" class="small">GitHub Stats · Top Languages · Repository-derived data</text>
<text x="1055" y="351" text-anchor="end" class="label" fill="#22d3ee">GRAPHITE / ELECTRIC BLUE / ICE CYAN</text>
<path d="M190 361H1020" stroke="#60a5fa" opacity=".35" stroke-width="1.5" class="dash"/>
<rect x="185" y="357" width="95" height="5" fill="url(#blue)" opacity=".8" class="scan"/>
</svg>