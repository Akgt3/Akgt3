<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">Observability and Performance — Akhil Saji</title>
<desc id="desc">Animated engineering dashboard infographic showing metrics, visualization, performance, reliability, and five engineering principles in a dark navy, electric blue, and ice cyan theme.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071321"/><stop offset=".55" stop-color="#0B0F14"/><stop offset="1" stop-color="#081A2A"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10243A"/><stop offset="1" stop-color="#091521"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60A5FA"/><stop offset=".55" stop-color="#A5D8FF"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#23415B" stroke-width=".7" opacity=".38"/>
    <circle cx="0" cy="0" r="1" fill="#60A5FA" opacity=".2"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .mono{font-family:'Courier New',monospace;letter-spacing:2px}
    .heading{font-size:34px;font-weight:800;letter-spacing:.4px;fill:url(#titleGrad)}
    .sub{font-size:6px;font-weight:700;fill:#60A5FA;letter-spacing:3px}
    .cardtitle{font-size:15px;font-weight:800;fill:#EAF2FC}
    .tiny{font-size:6px;font-weight:700;fill:#7DD3FC;letter-spacing:1px}
    .body{font-size:9px;fill:#B8CBE0}
    .principle{font-size:13px;font-weight:800;fill:#EAF2FC}
    .num{font-family:'Courier New',monospace;font-size:16px;font-weight:bold;fill:#7DD3FC}
    .line{stroke:url(#blue);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .float{animation:float 4s ease-in-out infinite}
    .dash{stroke-dasharray:5 9;animation:dash 18s linear infinite}
    .draw{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 3.5s ease forwards, breathe 3s ease-in-out 3.5s infinite}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 2s ease-out both}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes dash{to{stroke-dashoffset:-280}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes breathe{0%,100%{opacity:.8}50%{opacity:1}}
    @keyframes grow{from{transform:scaleX(.03);opacity:.35}to{transform:scaleX(1);opacity:1}}
  </style>
</defs>

<!-- Background -->
<rect width="1080" height="620" rx="12" fill="url(#bg)"/>
<rect x="1" y="1" width="1078" height="618" rx="12" fill="url(#grid)" opacity=".82"/>
<rect x="18" y="16" width="1044" height="588" rx="15" fill="none" stroke="#24445F" stroke-width="1" opacity=".65"/>
<path d="M0 184H1080" stroke="#24445F" stroke-width="1" opacity=".55"/>
<path d="M0 184H180" stroke="#22D3EE" stroke-width="2" opacity=".75"/>
<circle cx="52" cy="184" r="2" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
<circle cx="1022" cy="216" r="2" fill="#60A5FA" filter="url(#glow)" class="pulse"/>

<!-- Header -->
<text x="540" y="53" text-anchor="middle" class="heading">OBSERVABILITY &amp; PERFORMANCE</text>
<text x="540" y="70" text-anchor="middle" class="sub mono">MEASURE / VISUALIZE / OPTIMIZE / IMPROVE</text>

<!-- Icon pipeline -->
<g transform="translate(345 91)">
  <g class="float">
    <rect width="62" height="43" rx="12" fill="#071522" stroke="#28618A"/>
    <circle cx="31" cy="20" r="12" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="55 22" transform="rotate(-90 31 20)"/>
    <circle cx="31" cy="20" r="4" fill="#22D3EE" filter="url(#glow)"/>
    <text x="31" y="55" text-anchor="middle" class="tiny">METRICS</text>
  </g>
  <g transform="translate(80 0)" class="float">
    <rect width="62" height="43" rx="12" fill="#071522" stroke="#28618A"/>
    <path d="M18 30L26 12L31 7L36 12L44 30M23 30H39M31 10V27" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <text x="31" y="55" text-anchor="middle" class="tiny">VISUALIZE</text>
  </g>
  <g transform="translate(160 0)" class="float">
    <rect width="62" height="43" rx="12" fill="#071522" stroke="#28618A"/>
    <path d="M14 12H48V18H14ZM19 22H43M23 22V30M39 22V30" fill="none" stroke="#22D3EE" stroke-width="2"/>
    <text x="31" y="55" text-anchor="middle" class="tiny">OPTIMIZE</text>
  </g>
  <g transform="translate(240 0)" class="float">
    <rect width="62" height="43" rx="12" fill="#071522" stroke="#28618A"/>
    <path d="M31 7L45 15V29L31 36L17 29V15Z" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="31" cy="21" r="5" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="31" y="55" text-anchor="middle" class="tiny">RELIABILITY</text>
  </g>
  <g transform="translate(320 0)" class="float">
    <rect width="62" height="43" rx="12" fill="#071522" stroke="#28618A"/>
    <ellipse cx="31" cy="12" rx="16" ry="5" fill="none" stroke="#22D3EE" stroke-width="1.8"/>
    <path d="M15 12V29C15 36 47 36 47 29V12" fill="none" stroke="#60A5FA" stroke-width="1.8"/>
    <text x="31" y="55" text-anchor="middle" class="tiny">SYSTEMS</text>
  </g>
</g>

<!-- Pipeline rail -->
<path d="M145 184H923" stroke="#28618A" stroke-width="1.2" opacity=".8"/>
<path d="M145 184H923" stroke="#22D3EE" stroke-width="1.5" class="dash" opacity=".85"/>
<circle cx="145" cy="184" r="5" fill="#B8E8FF" filter="url(#glow)" class="pulse"/>
<circle cx="923" cy="184" r="5" fill="#B8E8FF" filter="url(#glow)" class="pulse"/>
<text x="540" y="174" text-anchor="middle" class="sub mono">OBSERVABILITY PIPELINE</text>

<!-- Four dashboard cards -->
<g>
  <rect x="68" y="202" width="223" height="140" rx="15" fill="url(#panel)" stroke="#24577D"/>
  <path d="M68 203H291" stroke="#60A5FA" stroke-width="3"/>
  <text x="86" y="229" class="cardtitle">METRICS</text>
  <text x="86" y="244" class="tiny">REQUESTS / LATENCY</text>
  <path d="M86 313L110 294L130 300L153 274L174 284L196 260L218 274L242 245L273 257" class="line draw"/>
  <path d="M86 313L110 294L130 300L153 274L174 284L196 260L218 274L242 245L273 257L273 322L86 322Z" fill="#60A5FA" opacity=".08"/>
  <circle cx="242" cy="245" r="4" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
  <text x="86" y="332" class="tiny">APPLICATION / INFRASTRUCTURE / EVENTS</text>
</g>
<g>
  <rect x="304" y="202" width="223" height="140" rx="15" fill="url(#panel)" stroke="#24577D"/>
  <path d="M304 203H527" stroke="#22D3EE" stroke-width="3"/>
  <text x="322" y="229" class="cardtitle">VISUALIZATION</text>
  <text x="322" y="244" class="tiny">GRAPHS / DASHBOARDS</text>
  <rect x="322" y="254" width="187" height="58" rx="8" fill="#071522" stroke="#24577D"/>
  <path d="M332 299L356 289L378 294L400 278L423 286L445 263L468 274L499 258" class="line draw"/>
  <circle cx="445" cy="263" r="4" fill="#B8E8FF" filter="url(#glow)" class="pulse"/>
  <text x="322" y="332" class="tiny">DASHBOARDS / ALERTING / SIGNALS</text>
</g>
<g>
  <rect x="540" y="202" width="222" height="140" rx="15" fill="url(#panel)" stroke="#24577D"/>
  <path d="M540 203H762" stroke="#60A5FA" stroke-width="3"/>
  <text x="558" y="229" class="cardtitle">PERFORMANCE</text>
  <text x="558" y="244" class="tiny">CODE / PROFILE / OPTIMIZE</text>
  <text x="558" y="264" class="tiny">CACHE HIT</text>
  <rect x="558" y="270" width="185" height="5" rx="3" fill="#19344B"/>
  <rect x="558" y="270" width="145" height="5" rx="3" fill="url(#blue)" class="bar"/>
  <text x="558" y="294" class="tiny">CPU PROFILE</text>
  <rect x="558" y="300" width="185" height="5" rx="3" fill="#19344B"/>
  <rect x="558" y="300" width="65" height="5" rx="3" fill="url(#blue)" class="bar" style="animation-delay:.4s"/>
  <text x="558" y="332" class="tiny">LATENCY / THROUGHPUT / EFFICIENCY</text>
</g>
<g>
  <!-- Reliability card: green treatment matching the supplied reference -->
  <rect x="775" y="202" width="223" height="140" rx="15"
        fill="#071D16" stroke="#145C3B" stroke-width="1"/>
  <path d="M775 203H998" stroke="#35F28B" stroke-width="3"/>
  <text x="793" y="229" class="cardtitle">RELIABILITY</text>
  <text x="793" y="244" font-size="6" font-weight="700"
        fill="#55F5A0" letter-spacing="1">HEALTH / TRACE / RECOVERY</text>
  <circle cx="887" cy="282" r="29" fill="none"
          stroke="#123D2B" stroke-width="7"/>
  <circle cx="887" cy="282" r="29" fill="none"
          stroke="#42F58F" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="151 32" transform="rotate(-90 887 282)"/>
  <text x="887" y="286" text-anchor="middle" font-size="14"
        font-weight="800" fill="#EAF2FC">99.9%</text>
  <text x="793" y="332" font-size="5.5" font-weight="700"
        fill="#55F5A0" letter-spacing=".8">HEALTH CHECKS / INCIDENTS / RESILIENCE</text>
</g>

<!-- Engineering philosophy -->
<text x="540" y="392" text-anchor="middle" font-size="29" font-weight="900" fill="url(#titleGrad)">ENGINEERING PHILOSOPHY</text>
<text x="540" y="409" text-anchor="middle" class="sub mono">PRINCIPLES FOR BUILDING SYSTEMS THAT LAST</text>
<path d="M53 420H1027" stroke="#24577D" stroke-width="1" opacity=".8"/>

<!-- Principle cards -->
<g>
  <rect x="52" y="434" width="182" height="130" rx="14" fill="url(#panel)" stroke="#24577D"/>
  <text x="68" y="463" class="num">01</text><circle cx="211" cy="458" r="5" fill="#60A5FA" filter="url(#glow)" class="pulse"/>
  <path d="M68 473H218" stroke="#24577D"/>
  <text x="143" y="499" text-anchor="middle" class="principle">CLARITY</text>
  <text x="143" y="522" text-anchor="middle" class="body">Simple systems are easier</text><text x="143" y="535" text-anchor="middle" class="body">to evolve.</text>
  <text x="68" y="552" class="tiny">01 / SIMPLE &amp; EXPLICIT</text>
</g>
<g>
  <rect x="246" y="434" width="182" height="130" rx="14" fill="url(#panel)" stroke="#24577D"/>
  <text x="262" y="463" class="num">02</text><circle cx="405" cy="458" r="3.5" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
  <path d="M262 473H412" stroke="#24577D"/>
  <text x="337" y="499" text-anchor="middle" class="principle">SCALABILITY</text>
  <text x="337" y="522" text-anchor="middle" class="body">Design for growth from the</text><text x="337" y="535" text-anchor="middle" class="body">beginning.</text>
  <text x="262" y="552" class="tiny">02 / SCALE WITH INTENT</text>
</g>
<g>
  <rect x="440" y="434" width="182" height="130" rx="14" fill="url(#panel)" stroke="#24577D"/>
  <text x="456" y="463" class="num">03</text><circle cx="599" cy="458" r="5" fill="#60A5FA" filter="url(#glow)" class="pulse"/>
  <path d="M456 473H606" stroke="#24577D"/>
  <text x="531" y="499" text-anchor="middle" class="principle">SECURITY</text>
  <text x="531" y="522" text-anchor="middle" class="body">Security belongs in every</text><text x="531" y="535" text-anchor="middle" class="body">layer.</text>
  <text x="456" y="552" class="tiny">03 / DEFENSE IN DEPTH</text>
</g>
<g>
  <rect x="634" y="434" width="182" height="130" rx="14" fill="url(#panel)" stroke="#24577D"/>
  <text x="650" y="463" class="num">04</text><circle cx="793" cy="458" r="4" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
  <path d="M650 473H800" stroke="#24577D"/>
  <text x="725" y="499" text-anchor="middle" class="principle">PERFORMANCE</text>
  <text x="725" y="522" text-anchor="middle" class="body">Fast systems create better</text><text x="725" y="535" text-anchor="middle" class="body">products.</text>
  <text x="650" y="552" class="tiny">04 / FAST BY DESIGN</text>
</g>
<g>
  <rect x="828" y="434" width="182" height="130" rx="14" fill="url(#panel)" stroke="#24577D"/>
  <text x="844" y="463" class="num">05</text><circle cx="987" cy="458" r="4" fill="#60A5FA" filter="url(#glow)" class="pulse"/>
  <path d="M844 473H994" stroke="#24577D"/>
  <text x="919" y="499" text-anchor="middle" class="principle">AUTOMATION</text>
  <text x="919" y="522" text-anchor="middle" class="body">Automate what should never</text><text x="919" y="535" text-anchor="middle" class="body">be manual.</text>
  <text x="844" y="552" class="tiny">05 / AUTOMATE THE REPEATABLE</text>
</g>

<!-- Footer -->
<text x="32" y="590" class="tiny mono">OBSERVABILITY // PERFORMANCE // RELIABILITY // ENGINEERING</text>
<text x="1048" y="590" text-anchor="end" class="tiny mono">SYSTEM_STATUS: NOMINAL</text>
<circle cx="1030" cy="586" r="3" fill="#22D3EE" filter="url(#glow)" class="pulse"/>
</svg>