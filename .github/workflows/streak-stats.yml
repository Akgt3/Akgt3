name: Update Contribution Streak

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate real streak statistics
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Akgt3&theme=dark&background=0B0F14&border=26374B&stroke=26374B&ring=60A5FA&fire=22D3EE&currStreakNum=EAF2FC&sideNums=EAF2FC&currStreakLabel=60A5FA&sideLabels=94A3B8&dates=64748B
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || (
            git commit -m "Update contribution streak" &&
            git push
          )
