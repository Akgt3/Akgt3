<text x="600" y="592" text-anchor="middle" class="mono muted" font-size="10" letter-spacing="2">AKHIL SAJI  //  MERN STACK  //  BUILD • DEBUG • SHIP • IMPROVE</text>
<text x="600" y="613" text-anchor="middle" class="mono" fill="#60A5FA" font-size="9" letter-spacing="1.5">GRAPHITE / ELECTRIC BLUE / ICE CYAN</text>
</svg>