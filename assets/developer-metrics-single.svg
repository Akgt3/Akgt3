<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Developer Metrics — Akgt3</title>
<desc id="desc">One unified animated dashboard with live GitHub profile statistics and language distribution loaded from external SVG image services, in a graphite, electric blue and ice cyan design.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#16304a" stroke-width=".7" opacity=".65"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
    .label{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94a3b8;letter-spacing:1.3px}
    .heading{font:700 28px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#eaf2fc;letter-spacing:1px}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    .scan{animation:scan 6s linear infinite}
    .dash{stroke-dasharray:5 8;animation:dash 13s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(950px)}}
    @keyframes dash{to{stroke-dashoffset:-180}}
    @media(prefers-reduced-motion:reduce){.pulse,.scan,.dash{animation:none}}
  </style>
</defs>
<rect x="1" y="1" width="1098" height="468" rx="16" fill="url(#bg)" stroke="#28445e"/>
<rect x="10" y="10" width="1080" height="450" rx="12" fill="url(#grid)"/>
<path d="M22 54V22H54 M1046 22h32v32 M22 406v32h32 M1046 438h32v-32" fill="none" stroke="#60a5fa" stroke-width="2"/>
<text x="42" y="48" class="mono" font-size="11" fill="#60a5fa">PROFILE ANALYTICS / 001</text>
<text x="42" y="88" class="heading">DEVELOPER METRICS</text>
<text x="43" y="113" class="label">CODE / BUILD / MEASURE / IMPROVE</text>
<circle cx="1016" cy="43" r="4" fill="#22d3ee" class="pulse"/>
<text x="1038" y="47" text-anchor="end" class="label" fill="#22d3ee">GITHUB PROFILE</text>
<path d="M40 135H1060" stroke="#24425f"/>
<rect x="40" y="153" width="490" height="250" rx="10" fill="#09111b" stroke="#24425f"/>
<rect x="550" y="153" width="510" height="250" rx="10" fill="#09111b" stroke="#24425f"/>
<rect x="40" y="153" width="490" height="3" rx="1.5" fill="#60a5fa"/>
<rect x="550" y="153" width="510" height="3" rx="1.5" fill="#22d3ee"/>
<text x="60" y="181" class="label" fill="#60a5fa">01 / PROFILE OVERVIEW</text>
<text x="570" y="181" class="label" fill="#22d3ee">02 / LANGUAGE DISTRIBUTION</text>
<!-- The images are separate live SVG cards served by GitHub Stats. -->
<image href="https://github-readme-stats.vercel.app/api?username=Akgt3&amp;show_icons=true&amp;hide_border=true&amp;bg_color=09111B&amp;title_color=60A5FA&amp;icon_color=22D3EE&amp;text_color=EAF2FC&amp;rank_icon=github&amp;include_all_commits=true" x="49" y="194" width="472" height="196" preserveAspectRatio="xMidYMid meet"/>
<image href="https://github-readme-stats.vercel.app/api/top-langs/?username=Akgt3&amp;layout=compact&amp;hide_border=true&amp;bg_color=09111B&amp;title_color=60A5FA&amp;text_color=EAF2FC&amp;langs_count=6" x="559" y="194" width="492" height="196" preserveAspectRatio="xMidYMid meet"/>
<path d="M40 421H1060" stroke="#24425f"/>
<text x="42" y="444" class="label">GRAPHITE BLACK / ELECTRIC BLUE / ICE CYAN</text>
<path d="M60 432H1015" stroke="#60a5fa" opacity=".45" stroke-width="1.5" class="dash"/>
<rect x="60" y="428" width="105" height="5" rx="2.5" fill="url(#blue)" class="scan"/>
</svg>