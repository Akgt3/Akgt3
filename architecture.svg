<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">MERN reference architecture</title>
<desc id="desc">Request and response flow between React frontend, Express API, Node.js services, and MongoDB.</desc>
<defs>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#0B0F14"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#60A5FA"/></marker>
</defs>
<rect width="1200" height="360" rx="14" fill="#080B10" stroke="#263244"/>
<text x="36" y="38" fill="#8AB4F8" font-family="monospace" font-size="13" letter-spacing="2">REFERENCE ARCHITECTURE / MERN</text>
<g font-family="monospace">
  <rect x="38" y="95" width="235" height="145" rx="10" fill="url(#box)" stroke="#60A5FA" stroke-opacity=".7"/>
  <text x="62" y="129" fill="#60A5FA" font-size="12">01 / CLIENT</text>
  <text x="62" y="162" fill="#F8FAFC" font-size="23" font-weight="bold">React UI</text>
  <text x="62" y="191" fill="#94A3B8" font-size="13">Components · State</text>
  <text x="62" y="211" fill="#94A3B8" font-size="13">Routes · User actions</text>

  <rect x="345" y="95" width="235" height="145" rx="10" fill="url(#box)" stroke="#60A5FA" stroke-opacity=".7"/>
  <text x="369" y="129" fill="#60A5FA" font-size="12">02 / API</text>
  <text x="369" y="162" fill="#F8FAFC" font-size="23" font-weight="bold">Express.js</text>
  <text x="369" y="191" fill="#94A3B8" font-size="13">Routes · Middleware</text>
  <text x="369" y="211" fill="#94A3B8" font-size="13">Validation · Responses</text>

  <rect x="652" y="95" width="235" height="145" rx="10" fill="url(#box)" stroke="#60A5FA" stroke-opacity=".7"/>
  <text x="676" y="129" fill="#60A5FA" font-size="12">03 / RUNTIME</text>
  <text x="676" y="162" fill="#F8FAFC" font-size="23" font-weight="bold">Node.js</text>
  <text x="676" y="191" fill="#94A3B8" font-size="13">Business logic</text>
  <text x="676" y="211" fill="#94A3B8" font-size="13">Async I/O · Services</text>

  <rect x="959" y="95" width="203" height="145" rx="10" fill="url(#box)" stroke="#34D399" stroke-opacity=".75"/>
  <text x="981" y="129" fill="#34D399" font-size="12">04 / DATA</text>
  <text x="981" y="162" fill="#F8FAFC" font-size="23" font-weight="bold">MongoDB</text>
  <text x="981" y="191" fill="#94A3B8" font-size="13">Documents</text>
  <text x="981" y="211" fill="#94A3B8" font-size="13">Persistence · Queries</text>
</g>
<g stroke="#60A5FA" stroke-width="2" fill="none" marker-end="url(#arrow)">
  <path d="M273 137H339"><animate attributeName="stroke-dasharray" values="3 8;12 5;3 8" dur="3s" repeatCount="indefinite"/></path>
  <path d="M580 137H646"><animate attributeName="stroke-dasharray" values="3 8;12 5;3 8" dur="3.5s" repeatCount="indefinite"/></path>
  <path d="M887 137H953"><animate attributeName="stroke-dasharray" values="3 8;12 5;3 8" dur="4s" repeatCount="indefinite"/></path>
</g>
<g font-family="monospace" fill="#64748B" font-size="11" text-anchor="middle">
  <text x="306" y="122">HTTP / JSON</text>
  <text x="613" y="122">REQUEST FLOW</text>
  <text x="920" y="122">QUERY / DATA</text>
  <text x="600" y="294" fill="#94A3B8" font-size="13">REQUEST → ROUTE → LOGIC → DATABASE → RESPONSE</text>
  <text x="600" y="321">Illustrative system model · Adapt to each project's actual implementation</text>
</g>
</svg>