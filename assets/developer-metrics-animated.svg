<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Animated Developer Metrics</title>
<desc id="desc">Premium graphite, electric blue and ice cyan dashboard frame with animated grid accents and separate live GitHub statistics cards intended to be displayed in the README instead of embedded in this SVG.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#16304a" stroke-width=".7" opacity=".65"/></pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
    .label{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94a3b8;letter-spacing:1.4px}
    .title{font:700 29px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#eaf2fc;letter-spacing:1px}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    .scan{animation:scan 6s linear infinite}
    .dash{stroke-dasharray:5 8;animation:dash 13s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(940px)}}
    @keyframes dash{to{stroke-dashoffset:-180}}
    @media(prefers-reduced-motion:reduce){.pulse,.scan,.dash{animation:none}}
  </style>
</defs>
<rect x="1" y="1" width="1098" height="428" rx="16" fill="url(#bg)" stroke="#28445e"/>
<rect x="10" y="10" width="1080" height="410" rx="12" fill="url(#grid)" opacity=".95"/>
<path d="M22 54V22H54 M1046 22h32v32 M22 376v32h32 M1046 408h32v-32" fill="none" stroke="#60a5fa" stroke-width="2"/>
<text x="42" y="48" class="mono" font-size="11" fill="#60a5fa">PROFILE ANALYTICS / 001</text>
<text x="42" y="91" class="title">DEVELOPER METRICS</text>
<text x="43" y="116" class="label">CODE / BUILD / MEASURE / IMPROVE</text>
<circle cx="1017" cy="43" r="4" fill="#22d3ee" class="pulse"/>
<text x="1038" y="47" text-anchor="end" class="label" fill="#22d3ee">LIVE PROFILE</text>
<path d="M40 139H1060" stroke="#24425f"/>
<rect x="40" y="157" width="490" height="208" rx="10" fill="#09111b" stroke="#24425f"/>
<rect x="550" y="157" width="510" height="208" rx="10" fill="#09111b" stroke="#24425f"/>
<rect x="40" y="157" width="490" height="3" rx="1.5" fill="#60a5fa"/>
<rect x="550" y="157" width="510" height="3" rx="1.5" fill="#22d3ee"/>
<text x="61" y="185" class="label" fill="#60a5fa">01 / PROFILE OVERVIEW</text>
<text x="571" y="185" class="label" fill="#22d3ee">02 / LANGUAGE DISTRIBUTION</text>
<path d="M60 210H510 M570 210H1040" stroke="#16304a"/>
<text x="61" y="239" class="mono" font-size="15" fill="#eaf2fc">REAL GITHUB DATA</text>
<text x="61" y="263" class="label">PUBLIC REPOSITORIES · CONTRIBUTIONS</text>
<text x="571" y="239" class="mono" font-size="15" fill="#eaf2fc">REPOSITORY LANGUAGES</text>
<text x="571" y="263" class="label">LANGUAGE BREAKDOWN · PROJECT CODE</text>
<text x="61" y="315" class="label">CARDS LOAD BELOW THIS HEADER IN README</text>
<text x="571" y="315" class="label">LIVE SERVICE IMAGES · NOT EMBEDDED</text>
<path d="M40 384H1060" stroke="#24425f"/>
<text x="42" y="405" class="label">GRAPHITE BLACK / ELECTRIC BLUE / ICE CYAN</text>
<path d="M60 394H1015" stroke="#60a5fa" opacity=".45" stroke-width="1.5" class="dash"/>
<rect x="60" y="390" width="105" height="5" rx="2.5" fill="url(#blue)" class="scan"/>
</svg>